locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "Junteng Liu's academic homepage"
url: "https://hermenrmizz.github.io"
baseurl: "/LJT-Homepage"
repository: "hermenrmizz/LJT-Homepage"

author:
  name: "Junteng Liu"
  bio: "First-year PhD candidate at HKUST NLP Group"
  employer: "HKUST NLP Group"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

social:
  type: Person
  name: "Junteng Liu"
  links:
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - "https://twitter.com/junteng88716710"

twitter:
  username: "junteng88716710"

breadcrumbs: false
read_more: "disabled"
talkmap_link: false
comments:
  provider: false
analytics:
  provider: false
atom_feed:
  hide: true

include:
  - _pages
exclude:
  - .devcontainer
  - .github
  - _drafts
  - _portfolio
  - _posts
  - _publications
  - _talks
  - _teaching
  - markdown_generator
  - node_modules
  - vendor
  - Dockerfile
  - docker-compose.yaml
  - package.json
  - package-lock.json
  - talkmap.ipynb
  - talkmap.py

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-paginate
  - jekyll-redirect-from
  - jemoji

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
